name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois, sans interrompre un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Ni `engines` ni `.nvmrc` dans le dépôt : la version n'est fixée qu'ici.
          node-version: '24'
          cache: npm

      - run: npm ci

      # Garde-fou avant publication : ~1,3 s, aucune raison de s'en priver.
      - run: npm test

      # `tsc -b` en strict précède `vite build` : un échec de typecheck bloque
      # le déploiement, c'est voulu.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
